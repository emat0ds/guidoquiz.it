<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" rx="0" fill="#F8F7FF"/>
  <rect x="60" y="60" width="500" height="510" rx="32" fill="#F0FDF4"/>
  <!-- Car -->
  <g transform="translate(120,180)">
    <rect x="40" y="60" width="180" height="70" rx="12" fill="#7C5CFC" opacity="0.8"/>
    <rect x="70" y="20" width="120" height="60" rx="10" fill="#7C5CFC" opacity="0.6"/>
    <circle cx="90" cy="135" r="20" fill="#374151"/>
    <circle cx="90" cy="135" r="10" fill="#9CA3AF"/>
    <circle cx="170" cy="135" r="20" fill="#374151"/>
    <circle cx="170" cy="135" r="10" fill="#9CA3AF"/>
    <!-- Checkmark on car -->
    <circle cx="230" cy="50" r="18" fill="#22C55E"/>
    <path d="M222 50l6 6 10-10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Scooter -->
  <g transform="translate(340,200)">
    <rect x="20" y="40" width="80" height="45" rx="8" fill="#3B82F6" opacity="0.7"/>
    <rect x="50" y="10" width="30" height="40" rx="6" fill="#3B82F6" opacity="0.5"/>
    <circle cx="30" cy="90" r="16" fill="#374151"/>
    <circle cx="30" cy="90" r="8" fill="#9CA3AF"/>
    <circle cx="90" cy="90" r="16" fill="#374151"/>
    <circle cx="90" cy="90" r="8" fill="#9CA3AF"/>
    <text x="60" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="white">125</text>
    <!-- Checkmark -->
    <circle cx="110" cy="20" r="14" fill="#22C55E"/>
    <path d="M104 20l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Van -->
  <g transform="translate(120,370)">
    <rect x="20" y="20" width="160" height="80" rx="10" fill="#F59E0B" opacity="0.7"/>
    <rect x="20" y="20" width="50" height="80" rx="10" fill="#F59E0B" opacity="0.9"/>
    <rect x="28" y="30" width="34" height="30" rx="4" fill="#FEF3C7"/>
    <circle cx="70" cy="105" r="16" fill="#374151"/>
    <circle cx="70" cy="105" r="8" fill="#9CA3AF"/>
    <circle cx="150" cy="105" r="16" fill="#374151"/>
    <circle cx="150" cy="105" r="8" fill="#9CA3AF"/>
    <!-- Checkmark -->
    <circle cx="190" cy="10" r="14" fill="#22C55E"/>
    <path d="M184 10l4 4 8-8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Truck X -->
  <g transform="translate(340,370)">
    <rect x="10" y="20" width="130" height="80" rx="10" fill="#9CA3AF" opacity="0.4"/>
    <rect x="10" y="20" width="40" height="80" rx="10" fill="#9CA3AF" opacity="0.6"/>
    <circle cx="50" cy="105" r="14" fill="#D1D5DB"/>
    <circle cx="110" cy="105" r="14" fill="#D1D5DB"/>
    <!-- X mark -->
    <circle cx="150" cy="10" r="14" fill="#EF4444"/>
    <path d="M144 4l12 12m0-12l-12 12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Right side text -->
  <text x="660" y="200" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#1A1A2E">Cosa si puo</text>
  <text x="660" y="255" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#1A1A2E">guidare con la</text>
  <text x="660" y="310" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#7C5CFC">patente B?</text>
  <text x="660" y="380" font-family="system-ui,sans-serif" font-size="22" fill="#666">Auto, moto 125, furgoni, quad</text>
  <text x="660" y="410" font-family="system-ui,sans-serif" font-size="22" fill="#666">e rimorchi: la guida completa</text>
  <!-- Guido Quiz badge -->
  <rect x="660" y="460" width="200" height="44" rx="22" fill="#7C5CFC"/>
  <text x="760" y="488" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="white">guidoquiz.it</text>
</svg>
